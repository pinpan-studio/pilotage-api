# Sauvegarde quotidienne : base Neon + fichiers Vercel Blob, conservée 30 jours comme artefact GitHub.
# Secrets à créer (Settings → Secrets and variables → Actions) : DATABASE_URL, BLOB_READ_WRITE_TOKEN.
name: Sauvegarde quotidienne
on:
  schedule: [{ cron: '17 2 * * *' }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Client PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - run: npm ci --omit=dev --ignore-scripts
      - name: Sauvegarde
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/sauvegarde.mjs sauvegarde
      - uses: actions/upload-artifact@v4
        with: { name: 'sauvegarde-${{ github.run_id }}', path: sauvegarde, retention-days: 30 }
